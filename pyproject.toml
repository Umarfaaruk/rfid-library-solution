[project]
name = "rfid-library"
version = "1.0.0"
description = "RFID-enabled library solution prototype that sits beside an existing ILMS (AISYS technical evaluation)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "sqlalchemy>=2.0",
    "pydantic>=2.7",
    "pyjwt>=2.8",
    "openpyxl>=3.1",
    "defusedxml>=0.7",
    "pillow>=10.3",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "httpx>=0.27", "ruff>=0.5", "pip-audit>=2.7"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]
ignore = ["S101", "S311", "B008"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S"]
"scripts/*" = ["S"]
# Installer helpers call fixed interpreter paths with fixed arguments; no user input reaches subprocess.
"packaging/*" = ["S603"]
